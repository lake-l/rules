name: Delete approved old publication logs
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cleanup-old-publication-logs.yml']
permissions:
  contents: read
  actions: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete only the two approved runs' logs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for run in 39380499173 39380524257; do
            url="https://api.github.com/repos/lake-l/rules/actions/runs/$run/logs"
            status=$(curl --silent --show-error --output "$RUNNER_TEMP/delete-result.json" --write-out '%{http_code}' --request DELETE --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' "$url")
            test "$status" = 204
            status=$(curl --silent --show-error --output "$RUNNER_TEMP/check-result.json" --write-out '%{http_code}' --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' "$url")
            test "$status" = 404 -o "$status" = 410
            echo "Approved run $run: logs deleted and unavailable."
          done
      - name: Verify the publisher after the history cleanup
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --output "$RUNNER_TEMP/dispatch-result.json" --write-out '%{http_code}' --request POST --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' --header 'Content-Type: application/json' --data '{"ref":"main"}' https://api.github.com/repos/lake-l/rules/actions/workflows/publish-cloudflare.yml/dispatches)
          test "$status" = 204
          echo 'Dispatched the existing publisher on main for verification.'

