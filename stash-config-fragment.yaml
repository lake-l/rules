# Merge rule-providers into your existing configuration.
# Assumes branch main and custom-*.yaml files in repository root.
rule-providers:
  custom-01-direct:
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/lake-l/rules/main/custom-01-direct.yaml
    interval: 86400
  custom-02-jms:
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/lake-l/rules/main/custom-02-jms.yaml
    interval: 86400
  custom-03-direct:
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/lake-l/rules/main/custom-03-direct.yaml
    interval: 86400
  custom-04-jms:
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/lake-l/rules/main/custom-04-jms.yaml
    interval: 86400
  custom-05-direct:
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/lake-l/rules/main/custom-05-direct.yaml
    interval: 86400
  custom-06-jms:
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/lake-l/rules/main/custom-06-jms.yaml
    interval: 86400
  custom-07-reject:
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/lake-l/rules/main/custom-07-reject.yaml
    interval: 86400
  custom-08-jms:
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/lake-l/rules/main/custom-08-jms.yaml
    interval: 86400
  custom-09-direct:
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/lake-l/rules/main/custom-09-direct.yaml
    interval: 86400

# Use this rules section to preserve the supplied rule order.
# JMS must already exist as a proxy or proxy group.
rules:
  - RULE-SET,custom-01-direct,DIRECT
  - RULE-SET,custom-02-jms,JMS
  - RULE-SET,custom-03-direct,DIRECT
  - RULE-SET,custom-04-jms,JMS
  - RULE-SET,custom-05-direct,DIRECT
  - RULE-SET,custom-06-jms,JMS
  - RULE-SET,custom-07-reject,REJECT
  - RULE-SET,custom-08-jms,JMS
  - RULE-SET,custom-09-direct,DIRECT
  - GEOIP,CN,DIRECT
  - MATCH,JMS
